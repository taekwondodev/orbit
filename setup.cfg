[metadata]
name = orbit
summary = Ephemeral sandboxes as an OpenStack service
description_file = README.md
author = taekwondodev
home_page = https://github.com/taekwondodev/orbit
python_requires = >=3.10
classifier =
    Environment :: OpenStack
    Programming Language :: Python :: 3

[files]
packages =
    orbit

[entry_points]
console_scripts =
    orbit-dbsync = orbit.cmd.dbsync:main
openstack.cli.extension =
    orbit = orbit.osc.plugin
openstack.orbit.v1 =
    orb_create = orbit.osc.v1:CreateOrb
    orb_list = orbit.osc.v1:ListOrb
    orb_show = orbit.osc.v1:ShowOrb
    orb_delete = orbit.osc.v1:DeleteOrb
oslo.config.opts =
    orbit = orbit.conf:list_opts
