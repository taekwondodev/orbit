heat_template_version: 2021-04-16

description: >
  Risorse di un orb di orbit: rete propria con router verso la rete esterna,
  chiave, firewall, porta, indirizzo raggiungibile e macchina, creata dentro
  una prenotazione Blazar gia attiva. Il lease NON fa parte di questo stack:
  lo crea prima il servizio e qui arriva la sua prenotazione come parametro.
  Vedi docs/adr/0005 e, per la rete, docs/adr/0006.

parameters:

  orb_id:
    type: string
    description: Identificativo dell'orb, usato per nominare le risorse.

  reservation_id:
    type: string
    description: >
      Identificativo della prenotazione Blazar. Blazar crea un flavor non
      pubblico con questo stesso identificativo e la taglia dell'orb, e lo
      rende accessibile al progetto quando la prenotazione diventa attiva:
      creare la macchina con quel flavor e il modo con cui la macchina
      finisce dentro la prenotazione.

  image:
    type: string
    description: Immagine del sistema operativo dell'orb.
    constraints:
      - custom_constraint: glance.image

  public_key:
    type: string
    description: Chiave pubblica fornita dal client. Il servizio non genera chiavi.

  public_network:
    type: string
    description: Rete esterna da cui prendere l'indirizzo raggiungibile.
    constraints:
      - custom_constraint: neutron.network

  cidr:
    type: string
    description: >
      Indirizzi della rete dell'orb. Ogni orb ha la sua rete e il suo router,
      quindi orb diversi possono usare lo stesso intervallo.
    default: 10.42.0.0/24

  ssh_allowed_cidr:
    type: string
    description: Da dove e ammesso l'accesso SSH all'orb.
    default: 0.0.0.0/0

resources:

  network:
    type: OS::Neutron::Net
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }

  subnet:
    type: OS::Neutron::Subnet
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      network: { get_resource: network }
      cidr: { get_param: cidr }
      ip_version: 4

  router:
    type: OS::Neutron::Router
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      external_gateway_info:
        network: { get_param: public_network }

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router: { get_resource: router }
      subnet: { get_resource: subnet }

  keypair:
    type: OS::Nova::KeyPair
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      public_key: { get_param: public_key }
      save_private_key: false

  security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      description: Accesso SSH a un orb di orbit.
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: { get_param: ssh_allowed_cidr }

  port:
    type: OS::Neutron::Port
    properties:
      network: { get_resource: network }
      fixed_ips:
        - subnet: { get_resource: subnet }
      security_groups:
        - { get_resource: security_group }

  floating_ip:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: public_network }

  floating_ip_association:
    type: OS::Neutron::FloatingIPAssociation
    # L'indirizzo esterno si associa solo a una porta raggiungibile dal
    # router: senza l'interfaccia, Neutron rifiuta l'associazione.
    depends_on: router_interface
    properties:
      floatingip_id: { get_resource: floating_ip }
      port_id: { get_resource: port }

  server:
    type: OS::Nova::Server
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      image: { get_param: image }
      flavor: { get_param: reservation_id }
      key_name: { get_resource: keypair }
      networks:
        - port: { get_resource: port }
      metadata:
        orbit_orb_id: { get_param: orb_id }

outputs:

  ssh_host:
    description: Indirizzo a cui il client si collega.
    value: { get_attr: [floating_ip, floating_ip_address] }

  server_id:
    description: >
      Macchina dell'orb. Il servizio la legge a ogni lettura dell'orb, perche
      Heat non si accorge se viene cancellata o spenta da fuori, anche da
      Blazar alla cancellazione del lease: lo stack resterebbe CREATE_COMPLETE.
      Vedi docs/design/stato.md.
    value: { get_resource: server }
