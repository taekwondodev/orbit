heat_template_version: 2021-04-16

description: >
  Resources of an orbit orb: its own network with a router to the external
  network, key, firewall, port, reachable address and machine, created inside
  an already active Blazar reservation. The lease is NOT part of this stack:
  the service creates it first and its reservation arrives here as a
  parameter. See docs/adr/0005 and, for the network, docs/adr/0006.

parameters:

  orb_id:
    type: string
    description: Identifier of the orb, used to name the resources.

  reservation_id:
    type: string
    description: >
      Identifier of the Blazar reservation. Blazar creates a non-public
      flavor with this same identifier and the orb's size, and makes it
      accessible to the project when the reservation becomes active:
      creating the machine with that flavor is how the machine ends up
      inside the reservation.

  image:
    type: string
    description: Operating system image of the orb.
    constraints:
      - custom_constraint: glance.image

  public_key:
    type: string
    description: Public key supplied by the client. The service generates no keys.

  public_network:
    type: string
    description: External network that provides the reachable address.
    constraints:
      - custom_constraint: neutron.network

  cidr:
    type: string
    description: >
      Addresses of the orb's network. Each orb has its own network and router,
      so different orbs can use the same range.
    default: 10.42.0.0/24

  ssh_allowed_cidr:
    type: string
    description: Where SSH access to the orb is allowed from.
    default: 0.0.0.0/0

resources:

  network:
    type: OS::Neutron::Net
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }

  subnet:
    type: OS::Neutron::Subnet
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      network: { get_resource: network }
      cidr: { get_param: cidr }
      ip_version: 4

  router:
    type: OS::Neutron::Router
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      external_gateway_info:
        network: { get_param: public_network }

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router: { get_resource: router }
      subnet: { get_resource: subnet }

  keypair:
    type: OS::Nova::KeyPair
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      public_key: { get_param: public_key }
      save_private_key: false

  security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      description: SSH access to an orbit orb.
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: { get_param: ssh_allowed_cidr }

  port:
    type: OS::Neutron::Port
    properties:
      network: { get_resource: network }
      fixed_ips:
        - subnet: { get_resource: subnet }
      security_groups:
        - { get_resource: security_group }

  floating_ip:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: public_network }

  floating_ip_association:
    type: OS::Neutron::FloatingIPAssociation
    # The external address can be associated only with a port reachable from
    # the router: without the interface, Neutron rejects the association.
    depends_on: router_interface
    properties:
      floatingip_id: { get_resource: floating_ip }
      port_id: { get_resource: port }

  server:
    type: OS::Nova::Server
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      image: { get_param: image }
      flavor: { get_param: reservation_id }
      key_name: { get_resource: keypair }
      networks:
        - port: { get_resource: port }
      metadata:
        orbit_orb_id: { get_param: orb_id }

outputs:

  ssh_host:
    description: Address the client connects to.
    value: { get_attr: [floating_ip, floating_ip_address] }

  server_id:
    description: >
      Machine of the orb. The service reads it on every read of the orb,
      because Heat does not notice if it is deleted or stopped from outside,
      also by Blazar when the lease is deleted: the stack would stay
      CREATE_COMPLETE. See docs/design/state.md.
    value: { get_resource: server }
