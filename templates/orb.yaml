heat_template_version: 2021-04-16

description: >
  Risorse di un orb di orbit: chiave, firewall, porta, indirizzo raggiungibile
  e macchina. Il flavor NON fa parte di questo stack: lo crea prima il servizio
  con la propria credenziale e qui arriva come parametro. Vedi docs/adr/0004.

parameters:

  orb_id:
    type: string
    description: Identificativo dell'orb, usato per nominare le risorse.

  flavor:
    type: string
    description: >
      Flavor privato dell'orb, creato dal servizio con la taglia richiesta e
      accessibile solo al progetto che crea questo stack.

  image:
    type: string
    description: Immagine del sistema operativo dell'orb.
    constraints:
      - custom_constraint: glance.image

  public_key:
    type: string
    description: Chiave pubblica fornita dal client. Il servizio non genera chiavi.

  network:
    type: string
    description: Rete di progetto a cui collegare l'orb.
    constraints:
      - custom_constraint: neutron.network

  public_network:
    type: string
    description: Rete esterna da cui prendere l'indirizzo raggiungibile.
    constraints:
      - custom_constraint: neutron.network

  ssh_allowed_cidr:
    type: string
    description: Da dove e ammesso l'accesso SSH all'orb.
    default: 0.0.0.0/0

resources:

  keypair:
    type: OS::Nova::KeyPair
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      public_key: { get_param: public_key }
      save_private_key: false

  security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      description: Accesso SSH a un orb di orbit.
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: { get_param: ssh_allowed_cidr }

  port:
    type: OS::Neutron::Port
    properties:
      network: { get_param: network }
      security_groups:
        - { get_resource: security_group }

  floating_ip:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: public_network }

  floating_ip_association:
    type: OS::Neutron::FloatingIPAssociation
    properties:
      floatingip_id: { get_resource: floating_ip }
      port_id: { get_resource: port }

  server:
    type: OS::Nova::Server
    properties:
      name: { list_join: ['-', ['orbit', { get_param: orb_id }]] }
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_resource: keypair }
      networks:
        - port: { get_resource: port }
      metadata:
        orbit_orb_id: { get_param: orb_id }

outputs:

  ssh_host:
    description: Indirizzo a cui il client si collega.
    value: { get_attr: [floating_ip, floating_ip_address] }

  server_id:
    description: >
      Macchina dell'orb. Il servizio la legge a ogni lettura dell'orb, perche
      Heat non si accorge se viene cancellata o spenta da fuori: lo stack
      resterebbe CREATE_COMPLETE. Vedi docs/design/stato.md.
    value: { get_resource: server }
