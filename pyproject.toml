[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "orbit"
description = "Ephemeral sandboxes as an OpenStack service"
authors = [
    {name = "taekwondodev"},
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
dynamic = ["version", "dependencies"]
requires-python = ">=3.10"
classifiers = [
    "Environment :: OpenStack",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/taekwondodev/orbit"

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
extend-select = ["B904"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["orbit"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
