[tox]
minversion = 4.0.0
envlist = py3,genconfig

[testenv]
usedevelop = True
deps =
  -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
commands = stestr run {posargs}

[testenv:genconfig]
commands = oslo-config-generator --config-file etc/orbit-config-generator.conf

[testenv:dashboard]
# Horizon 27 requires Python 3.11 or later; orbit-api does not import it,
# so it stays out of requirements.txt and of py3.
deps =
  {[testenv]deps}
  horizon
commands = python -m django test orbit.dashboard.tests --settings=orbit.dashboard.tests.settings {posargs}
