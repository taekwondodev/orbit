<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="545" viewBox="0 0 1150 545" role="img" aria-label="Where a failure shows up"><title>Where a failure shows up</title><defs></defs><rect x="0.75" y="0.75" width="1148.5" height="543.5" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Where a failure shows up</text><text x="28" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">an HTTP error if it happens before the response, the ERROR status if after</text><rect x="28" y="100" width="530" height="390" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="42" y="89" width="344.8" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="51" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#0f172a">before the response: the request fails</text><rect x="52" y="135" width="52" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="78" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#450a0a">400</text><text x="120" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">invalid size, public key or image</text><rect x="52" y="175" width="52" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="78" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#450a0a">401</text><text x="120" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">token missing, expired or invalid</text><rect x="52" y="215" width="52" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="78" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#450a0a">403</text><text x="120" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">token without project, or insufficient roles downstream</text><rect x="52" y="255" width="52" height="24" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="78" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#451a03">409</text><text x="120" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">capacity exhausted: Blazar responds 500 with the message</text><text x="120" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">"Not enough hosts available", orbit translates it</text><rect x="52" y="317" width="52" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="78" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#450a0a">502</text><text x="120" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Blazar, Heat or Nova reject for another reason</text><rect x="52" y="357" width="52" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="78" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#450a0a">503</text><text x="120" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Blazar, Heat or Nova unreachable or failing</text><rect x="52" y="420" width="482" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="293.0" y="449.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">no orb and no lease are left</text><rect x="592" y="100" width="530" height="390" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="606" y="89" width="246.0" height="22" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="615" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#450a0a">after the 202: the orb goes to ERROR</text><circle cx="620" cy="145" r="5" fill="#dc2626"/><text x="636" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#0f172a">the reservation does not activate within creation_timeout</text><text x="636" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">fault: creation interrupted</text><circle cx="620" cy="209" r="5" fill="#dc2626"/><text x="636" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#0f172a">orbit-api restarts during RESERVING</text><text x="636" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">fault: creation interrupted, after creation_timeout</text><circle cx="620" cy="273" r="5" fill="#dc2626"/><text x="636" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#0f172a">Heat fails to build the stack</text><text x="636" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">fault: Heat's reason (Neutron quota, no host)</text><circle cx="620" cy="337" r="5" fill="#dc2626"/><text x="636" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#0f172a">machine, stack or lease deleted from outside</text><text x="636" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">fault: machine, stack or reservation no longer present</text><rect x="616" y="420" width="482" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="857.0" y="449.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#450a0a">the resources stay up until a DELETE arrives</text><text x="28" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#64748b">Source: docs/design/api.md, Error codes</text></svg>
