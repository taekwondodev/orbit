<svg xmlns="http://www.w3.org/2000/svg" width="160" height="112" viewBox="-80 -56 160 112" role="img" aria-labelledby="title">
<title id="title">orbit</title>
<defs>
  <path id="orbit" d="M-62 0 a62 18 0 1 0 124 0 a62 18 0 1 0 -124 0"/>
  <clipPath id="behind"><rect x="-80" y="-60" width="160" height="60"/></clipPath>
  <clipPath id="ahead"><rect x="-80" y="0" width="160" height="60"/></clipPath>
  <clipPath id="disc"><circle r="38"/></clipPath>
</defs>
<g transform="rotate(-18)" opacity="0"><animate attributeName="opacity" begin="1s" dur="0.12s" values="0;1" fill="freeze"/>
  <path d="M-62 0 a62 18 0 0 1 124 0" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#behind)"><circle r="4.5" fill="#f59e0b"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle></g>
</g>
<circle r="38" fill="#14b8a6" opacity="0"><animate attributeName="opacity" begin="0.7s" dur="0.4s" values="0;1" fill="freeze"/></circle>
<path d="M-40 0 a40 40 0 1 0 80 0 a40 40 0 1 0 -80 0" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="butt"><animate attributeName="stroke-dashoffset" dur="0.7s" values="1;0" fill="freeze"/></path>
<g transform="rotate(-18)" opacity="0"><animate attributeName="opacity" begin="1s" dur="0.12s" values="0;1" fill="freeze"/>
  <path d="M-62 0 a62 18 0 0 0 124 0" fill="none" stroke="#0f766e" stroke-width="6" clip-path="url(#disc)"/>
  <path d="M-62 0 a62 18 0 0 0 124 0" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#ahead)"><circle r="4.5" fill="#f59e0b"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle></g>
</g>
</svg>
