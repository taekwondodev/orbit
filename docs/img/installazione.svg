<text x="28" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#475569">fase di stack.sh</text><rect x="28" y="140" width="122" height="96" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="89.0" y="184.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#4c0519">heat</text><text x="89.0" y="202.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">enable_plugin</text><rect x="168" y="140" width="250" height="96" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="293.0" y="192.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4c0519">installa heat</text><rect x="426" y="140" width="250" height="96" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="551.0" y="192.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4c0519">configura heat</text><rect x="684" y="140" width="250" height="96" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="809.0" y="183.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4c0519">avvia h-eng, h-api,</text><text x="809.0" y="201.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">h-api-cfn</text><rect x="28" y="250" width="122" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="89.0" y="294.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#451a03">blazar</text><text x="89.0" y="312.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">enable_plugin</text><rect x="168" y="250" width="250" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="293.0" y="293.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#451a03">installa blazar,</text><text x="293.0" y="311.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">blazar-nova, client</text><rect x="426" y="250" width="250" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="551.0" y="293.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#451a03">configura blazar,</text><text x="551.0" y="311.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">BlazarFilter in Nova</text><rect x="684" y="250" width="250" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="809.0" y="293.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#451a03">aggregato freepool,</text><text x="809.0" y="311.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">avvia blazar-a, blazar-m</text><rect x="28" y="360" width="122" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="89.0" y="396.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1e1b4b">orbit</text><text x="89.0" y="414.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">enable_plugin</text><text x="89.0" y="431.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">per ultimo</text><rect x="168" y="360" width="250" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="293.0" y="403.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e1b4b">pip install -e</text><text x="293.0" y="421.75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">/opt/stack/orbit</text><rect x="426" y="360" width="250" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="551.0" y="395.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e1b4b">orbit.conf, uwsgi</text><text x="551.0" y="413.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">database + orbit-dbsync</text><text x="551.0" y="430.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">utente e endpoint /orbit</text><rect x="684" y="360" width="250" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="809.0" y="395.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1e1b4b">discover_hosts da sé</text><text x="809.0" y="413.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">registra l'host in Blazar</text><text x="809.0" y="430.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">avvia orbit-api</text><rect x="958" y="140" width="164" height="316" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="1040.0" y="243.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#052e16">DevStack</text><text x="1040.0" y="261.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">discover_hosts: mappa</text><text x="1040.0" y="278.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">gli host nella cella</text><text x="1040.0" y="295.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">di Nova</text><text x="1040.0" y="312.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569"></text><text x="1040.0" y="329.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">tempest: installa i</text><text x="1040.0" y="346.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">plugin di</text><text x="1040.0" y="363.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">TEMPEST_PLUGINS</text><text x="28" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Le fasi girano in ordine e, dentro ogni fase, i plugin nell'ordine delle righe enable_plugin: orbit trova Heat e Blazar già avviati.</text><text x="28" y="521" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">DevStack mappa gli host solo dopo extra, e Nova non mostra gli host non mappati: per questo orbit esegue discover_hosts prima di registrarli in Blazar.</text><text x="28" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Con l'host registrato, Nova lo riserva alle prenotazioni Blazar: le macchine senza prenotazione non vi trovano posto.</text></svg>
