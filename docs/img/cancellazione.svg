<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="520" viewBox="0 0 1150 520" role="img" aria-label="Cancellazione di un orb"><title>Cancellazione di un orb</title><defs><marker id="a475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="1148.5" height="518.5" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Cancellazione</text><text x="28" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">una richiesta, due proprietari</text><rect x="28" y="190.0" width="165" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="110.5" y="223.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">DELETE</text><text x="110.5" y="241.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">/v1/orbs/{id}</text><text x="110.5" y="258.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">dal client</text><rect x="225" y="180.0" width="190" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="320.0" y="214.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">orb in DELETING</text><text x="320.0" y="232.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">da qualunque stato,</text><text x="320.0" y="249.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">con scrittura</text><text x="320.0" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">condizionata</text><rect x="447" y="110" width="250" height="250" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="572.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#4c0519">1 · Heat cancella lo stack</text><text x="572.0" y="190.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">in ordine inverso alle dipendenze:</text><text x="572.0" y="207.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">macchina, associazione, IP,</text><text x="572.0" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">porta, security group, chiave,</text><text x="572.0" y="241.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">interfaccia, router,</text><text x="572.0" y="258.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">sottorete e rete</text><text x="572.0" y="275.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569"></text><text x="572.0" y="292.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">risponde subito e prosegue</text><text x="572.0" y="309.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">in background</text><rect x="729" y="110" width="250" height="250" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="854.0" y="180.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#451a03">2 · Blazar cancella il lease</text><text x="854.0" y="198.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">esegue on_end della prenotazione:</text><text x="854.0" y="215.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">revoca l'accesso al flavor,</text><text x="854.0" y="232.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">distrugge le macchine che lo</text><text x="854.0" y="249.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">usano ancora e aspetta,</text><text x="854.0" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">poi cancella flavor e aggregato</text><text x="854.0" y="283.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569"></text><text x="854.0" y="300.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">risponde a lavoro finito</text><rect x="1011" y="190.0" width="115" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="1068.5" y="231.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">202</text><text x="1068.5" y="249.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">DELETING</text><path d="M193,235.0 L225,235.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M415,235.0 L447,235.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M697,235.0 L729,235.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M979,235.0 L1011,235.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M1068,280.0 L1068,398" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><rect x="993.4" y="360" width="71.60000000000001" height="34" rx="4" fill="#ffffff" opacity="0.92"/><text x="1060" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#475569">GET</text><text x="1060" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#475569">successiva</text><rect x="1008.0" y="399.0" width="120" height="34" rx="1