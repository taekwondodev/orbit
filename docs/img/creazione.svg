<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="Creazione di un orb nel tempo, con i tempi misurati"><title>Creazione di un orb nel tempo, con i tempi misurati</title><defs></defs><rect x="0.75" y="0.75" width="1098.5" height="398.5" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Creazione: cosa succede e quando</text><text x="28" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">la risposta arriva subito; prenotazione e costruzione proseguono nel compito di creazione</text><rect x="60.0" y="96" width="130.66666666666666" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="125.33333333333333" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#451a03">RESERVING</text><rect x="190.66666666666666" y="96" width="130.66666666666666" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="256.0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#172554">BUILDING</text><rect x="321.3333333333333" y="96" width="718.6666666666667" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="680.6666666666666" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#052e16">ACTIVE</text><line x1="60" y1="164" x2="1040" y2="164" stroke="#94a3b8" stroke-width="1.5"/><line x1="60.0" y1="159" x2="60.0" y2="169" stroke="#94a3b8" stroke-width="1.5"/><text x="60.0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#64748b">0 s</text><line x1="223.33333333333334" y1="159" x2="223.33333333333334" y2="169" stroke="#94a3b8" stroke-width="1.5"/><text x="223.33333333333334" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#64748b">10 s</text><line x1="386.6666666666667" y1="159" x2="386.6666666666667" y2="169" stroke="#94a3b8" stroke-width="1.5"/><text x="386.6666666666667" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#64748b">20 s</text><line x1="550.0" y1="159" x2="550.0" y2="169" stroke="#94a3b8" stroke-width="1.5"/><text x="550.0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#64748b">30 s</text><line x1="713.3333333333334" y1="159" x2="713.3333333333334" y2="169" stroke="#94a3b8" stroke-width="1.5"/><text x="713.3333333333334" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#64748b">40 s</text><line x1="876.6666666666666" y1="159" x2="876.6666666666666" y2="169" stroke="#94a3b8" stroke-width="1.5"/><text x="876.6666666666666" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#64748b">50 s</text><line x1="1040.0" y1="159" x2="1040.0" y2="169" stroke="#94a3b8" stroke-width="1.5"/><text x="1040.0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#64748b">60 s</text><circle cx="60.0" cy="164" r="11" fill="#334155"/><text x="60.0" y="168.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><circle cx="71" cy="235" r="11" fill="#334155"/><text x="71" y="239.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="92" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#0f172a">0 s  ·  POST /v1/orbs, risposta 202 in RESERVING</text><text x="92" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">il lease nasce durante la richiesta: senza capacità</text><text x="92" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">la risposta è 409 e non resta nulla</text><circle cx="190.66666666666666" cy="164" r="11" fill="#d97706"/><text x="190.66666666666666" y="168.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><circle cx="581" cy="235" r="11" fill="#d97706"/><text x="581" y="239.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="602" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#0f172a">≈ 8 s  ·  Blazar attiva la prenotazione</text><text x="602" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">il suo ciclo di eventi gira ogni 10 s; il compito se ne</text><text x="602" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">accorge (lettura ogni 2 s) e crea lo stack col flavor</text><circle cx="321.3333333333333" cy="164" r="11" fill="#16a34a"/><text x="321.3333333333333" y="168.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><circle cx="71" cy="313" r="11" fill="#16a34a"/><text x="71" y="317.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="92" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#0f172a">14-18 s  ·  stack CREATE_COMPLETE, macchina ACTIVE</text><text x="92" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">la GET successiva risponde ACTIVE con ssh_host</text><circle cx="958.3333333333334" cy="164" r="11" fill="#15803d"/><text x="958.3333333333334" y="168.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><circle cx="581" cy="313" r="11" fill="#15803d"/><text x="581" y="317.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="602" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#0f172a">≈ 55 s  ·  SSH risponde</text><text x="602" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">cirros finisce di avviarsi su QEMU emulato</text><text x="28" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Misurato su DevStack 2027.1, Ubuntu 24.04 aarch64, QEMU senza KVM, cirros con 1 vCPU, 512 MB, 1 GB. Se lo stack non nasce entro creation_timeout (120 s), l'orb va in ERROR.</text></svg>
