<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="400" viewBox="0 0 1150 400" role="img" aria-label="Creation of an orb: the two waits"><title>Creation of an orb: the two waits</title><defs><marker id="a475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="1148.5" height="398.5" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Creation</text><text x="28" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">the response arrives at once; the two waits go on in the creation task</text><rect x="28" y="140" width="170" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="113.0" y="173.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">POST /v1/orbs</text><text x="113.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">the lease is created</text><text x="113.0" y="208.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">during the request</text><rect x="238" y="110" width="270" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="373.0" y="139.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#451a03">RESERVING</text><text x="373.0" y="157.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">waiting for Blazar to activate</text><text x="373.0" y="174.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">the reservation: only then can</text><text x="373.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">the project use the flavor;</text><text x="373.0" y="208.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">the creation task rereads</text><text x="373.0" y="225.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">the lease every</text><text x="373.0" y="242.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">[orbs] reservation_poll_interval</text><rect x="548" y="110" width="270" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="683.0" y="164.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#172554">BUILDING</text><text x="683.0" y="182.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">the task created the stack</text><text x="683.0" y="199.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">with the reservation's flavor;</text><text x="683.0" y="216.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">Heat builds the resources</text><rect x="858" y="110" width="264" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="990.0" y="164.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#052e16">ACTIVE</text><text x="990.0" y="182.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">stack CREATE_COMPLETE</text><text x="990.0" y="199.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">and machine ACTIVE:</text><text x="990.0" y="216.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">GET returns ssh_host</text><path d="M198,185 L238,185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><text x="218" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#475569">202</text><path d="M508,185 L548,185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M818,185 L858,185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M113,230 L113,320" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#adc2626)"/><rect x="28" y="320" width="170" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="113.0" y="339.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#450a0a">409</text><text x="113.0" y="357.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">no capacity, nothing is left</text><path d="M373,260 L373,320" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#adc2626)"/><rect x="238" y="320" width="270" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="373.0" y="339.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#450a0a">ERROR</text><text x="373.0" y="357.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">no stack within [orbs] creation_timeout</text><path d="M683,260 L683,320" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#adc2626)"/><rect x="548" y="320" width="270" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="683.0" y="339.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#450a0a">ERROR</text><text x="683.0" y="357.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">CREATE_FAILED, Heat's reason</text><text x="28" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#64748b">Source: docs/architecture.md; options in etc/orbit.conf.