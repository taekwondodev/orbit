" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">router ↔ sottorete</text><rect x="805" y="135" width="130" height="72" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="870.0" y="167.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#082f49">router</text><text x="870.0" y="185.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">gateway esterno</text><rect x="355" y="255" width="130" height="72" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="420.0" y="287.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#082f49">security group</text><text x="420.0" y="305.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">tcp/22 in ingresso</text><rect x="505" y="255" width="130" height="72" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="570.0" y="287.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#082f49">porta</text><text x="570.0" y="305.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">sottorete + SG</text><rect x="655" y="255" width="130" height="72" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="720.0" y="287.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#082f49">associazione</text><text x="720.0" y="305.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">IP ↔ porta</text><rect x="805" y="255" width="130" height="72" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="870.0" y="287.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#082f49">IP flottante</text><text x="870.0" y="305.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">→ output ssh_host</text><rect x="505" y="375" width="130" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="570.0" y="407.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#052e16">macchina</text><text x="570.0" y="425.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">→ output server_id</text><rect x="655" y="375" width="130" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="720.0" y="407.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#052e16">chiave</text><text x="720.0" y="425.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">public_key del client</text><rect x="990" y="140" width="145" height="200" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1062.5" y="219.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#082f49">rete esterna</text><text x="1062.5" y="237.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">public</text><text x="1062.5" y="254.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">[orbs]</text><text x="1062.5" y="271.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">public_network</text><path d="M505,171.0 L485,171.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M655,171.0 L635,171.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M785,171.0 L805,171.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M935,171.0 L990,171.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M505,291.0 L485,291.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M570.0,255 L570.0,207" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M655,291.0 L635,291.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M785,291.0 L805,291.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M720.0,255 L720.0,207" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a475569)"/><rect x="721.0" y="226" width="71.60000000000001" height="19" rx="4" fill="#ffffff" opacity="0.92"/><text x="726.0" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#475569">depends_on</text><path d="M935,291.0 L990,291.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M570.0,375 L570.0,327" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M635,411.0 L655,411.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M505,411.0 L280,411.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad97706)"/><rect x="352.24" y="390.0" width="145.52" height="19" rx="4" fill="#ffffff" opacity="0.92"/><text x="425" y="402.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#92400e">flavor: reservation_id</text><text x="355" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#64748b">freccia: "usa"; tratteggio: dipendenza o riferimento fuori dallo stack</text><text x="28" y="512.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">Un orb è una riga della tabella orbs che lega questo lease e questo stack: nascono insieme e muoiono insieme.</text><text x="28" y="529.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#475569">Gli output ssh_host e server_id si rileggono a ogni GET; il lease resta fuori dallo stack perché Heat non aspetterebbe la prenotazione attiva (ADR 0005).</text></svg>
