<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-label="Composizione di un orb: lease Blazar e stack Heat"><title>Composizione di un orb: lease Blazar e stack Heat</title><defs><marker id="a475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="1158.5" height="558.5" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Di cosa è fatto un orb</text><text x="28" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Blazar possiede capacità e flavor, Heat tutte le altre risorse; ogni orb ha la sua rete e il suo router (ADR 0006)</text><rect x="28" y="105" width="272" height="370" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="42" y="94" width="253.6" height="22" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="51" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#451a03">lease Blazar, fuori dallo stack</text><rect x="48" y="130" width="232" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="164.0" y="157.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#451a03">lease orbit-&lt;id&gt;</text><text x="164.0" y="175.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">inizio: adesso</text><text x="164.0" y="192.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">fine: 2099, non è una scadenza</text><rect x="48" y="245" width="232" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="164.0" y="272.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#451a03">prenotazione</text><text x="164.0" y="290.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">virtual:instance, amount 1</text><text x="164.0" y="307.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">vcpus, memory_mb, disk_gb</text><rect x="48" y="365" width="232" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="164.0" y="395.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#451a03">flavor della prenotazione</text><text x="164.0" y="413.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">id = reservation_id, privato</text><text x="164.0" y="430.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">usabile a prenotazione attiva</text><path d="M164,210 L164,245" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M164,325 L1