le-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569"></text><text x="854.0" y="300.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">responds when done</text><rect x="1011" y="190.0" width="115" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="1068.5" y="231.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">202</text><text x="1068.5" y="249.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">DELETING</text><path d="M193,235.0 L225,235.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M415,235.0 L447,235.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M697,235.0 L729,235.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M979,235.0 L1011,235.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><path d="M1068,280.0 L1068,398" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a475569)"/><rect x="993.4" y="360" width="71.60000000000001" height="34" rx="4" fill="#ffffff" opacity="0.92"/><text x="1060" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#475569">GET</text><text x="1060" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#475569">after</text><rect x="1008.0" y="399.0" width="120" height="34" rx="17.0" fill="#e2e8f0" stroke="#334155" stroke